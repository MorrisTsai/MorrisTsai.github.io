<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="A grid with nine of twelve equal parts shaded">
  <rect width="520" height="360" fill="#ffffff"/>
  <g transform="translate(100 60)">
    <rect x="0" y="0" width="320" height="240" fill="#ffffff" stroke="#111827" stroke-width="6"/>
    <g fill="#111827">
      <rect x="0" y="0" width="80" height="80"/>
      <rect x="80" y="0" width="80" height="80"/>
      <rect x="160" y="0" width="80" height="80"/>
      <rect x="240" y="0" width="80" height="80"/>
      <rect x="0" y="80" width="80" height="80"/>
      <rect x="80" y="80" width="80" height="80"/>
      <rect x="160" y="80" width="80" height="80"/>
      <rect x="0" y="160" width="80" height="80"/>
      <rect x="80" y="160" width="80" height="80"/>
    </g>
    <g stroke="#111827" stroke-width="4">
      <line x1="80" y1="0" x2="80" y2="240"/>
      <line x1="160" y1="0" x2="160" y2="240"/>
      <line x1="240" y1="0" x2="240" y2="240"/>
      <line x1="0" y1="80" x2="320" y2="80"/>
      <line x1="0" y1="160" x2="320" y2="160"/>
    </g>
  </g>
</svg>
