    <circle cx="110" cy="110" r="42" fill="#ffffff" opacity=".95"/>
    <rect x="185" y="66" width="128" height="24" rx="12" fill="#ffffff" opacity=".88"/>
    <rect x="185" y="108" width="96" height="24" rx="12" fill="#ffffff" opacity=".7"/>
    <rect x="185" y="150" width="142" height="24" rx="12" fill="#ffffff" opacity=".55"/>
