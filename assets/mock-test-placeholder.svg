<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">AEAS mock test placeholder</title>
  <desc id="desc">A neutral placeholder graphic for mock test questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#073d8f"/>
      <stop offset="1" stop-color="#061c46"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="130" y="90" width="940" height="620" rx="34" fill="#fff" stroke="#dbe5f2" stroke-width="4"/>
  <rect x="190" y="155" width="520" height="34" rx="17" fill="#dbe5f2"/>
  <rect x="190" y="220" width="820" height="22" rx="11" fill="#e8eef8"/>
  <rect x="190" y="266" width="720" height="22" rx="11" fill="#e8eef8"/>
  <rect x="190" y="312" width="780" height="22" rx="11" fill="#e8eef8"/>
