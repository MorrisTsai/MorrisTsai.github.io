  <text x="190" y="660" fill="#10234a" font-family="Arial, sans-serif" font-size="34" font-weight="800">Question Placeholder</text>
  <text x="190" y="704" fill="#607086" font-family="Arial, sans-serif" font-size="22">Replace with original diagnostic questions later</text>
