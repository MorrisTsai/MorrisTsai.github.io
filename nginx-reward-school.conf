server {
    listen 443 ssl;
    server_name www.rewardschool.com.au;

    root /var/www/reward-school-web;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 80m;
    client_body_timeout 420s;

    ssl_certificate /etc/letsencrypt/live/rewardschool.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewardschool.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    if ($request_uri = /index.html) {
        return 301 https://www.rewardschool.com.au/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5132/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 420s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires -1;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|mp3)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

server {
    listen 443 ssl;
    server_name rewardschool.com.au;

    ssl_certificate /etc/letsencrypt/live/rewardschool.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rewardschool.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.rewardschool.com.au$request_uri;
}

server {
    listen 80;
    server_name rewardschool.com.au www.rewardschool.com.au;
    return 301 https://www.rewardschool.com.au$request_uri;
}
